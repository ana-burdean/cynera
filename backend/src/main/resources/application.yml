spring:
  application:
    name: cynera-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/cynera
    username: cynera
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info