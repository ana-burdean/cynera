spring:
  application:
    name: cynera-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/cynera
    username: cynera
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

cynera:
  jwt:
    secret: cynera-development-secret-key-2026-change-me
    expiration-ms: 86400000